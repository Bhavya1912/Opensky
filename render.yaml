services:
  - type: web
    name: opensky-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      # Add OPENSKY_USERNAME and OPENSKY_PASSWORD in the Render dashboard
